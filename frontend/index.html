<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="BeautySalon — salon billing, appointments, and reports" />
    <title>BeautySalon</title>
    <script>
      ;(function () {
        try {
          var path = window.location.pathname || ''
          var isLogin = path === '/login' || path.indexOf('/login/') === 0
          // Login is always light — ignore saved / system dark to avoid a dark flash.
          if (isLogin) {
            document.documentElement.classList.remove('dark')
            var loginDesktop = window.matchMedia('(min-width: 1024px)').matches
            var loginColor = loginDesktop ? '#FFFFFF' : '#0b0b0b'
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.setAttribute('content', loginColor)
            })
            return
          }
          var key = 'persist:beauty-salon'
          var raw = localStorage.getItem(key)
          var mode = 'system'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.settings) {
              var settings =
                typeof parsed.settings === 'string'
                  ? JSON.parse(parsed.settings)
                  : parsed.settings
              if (settings && settings.themeMode) mode = settings.themeMode
            }
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          else document.documentElement.classList.remove('dark')
          var color = dark ? '#141414' : '#FFFFFF'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', color)
          })
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
