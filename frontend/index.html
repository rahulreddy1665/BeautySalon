<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5c4638" />
    <meta name="description" content="BeautySalon — salon billing, appointments, and reports" />
    <title>BeautySalon</title>
    <script>
      ;(function () {
        try {
          var key = 'persist:beauty-salon'
          var raw = localStorage.getItem(key)
          var mode = 'system'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.settings) {
              var settings =
                typeof parsed.settings === 'string'
                  ? JSON.parse(parsed.settings)
                  : parsed.settings
              if (settings && settings.themeMode) mode = settings.themeMode
            }
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          else document.documentElement.classList.remove('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#292929' : '#5c4638')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
